<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Smoke</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;cursor:crosshair;font-family:'Segoe UI',system-ui,sans-serif;}
canvas{display:block;}
#ui{position:fixed;bottom:20px;left:20px;background:rgba(12,15,30,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(80,100,160,0.12);border-radius:10px;padding:14px 18px;color:rgba(210,215,230,0.9);font-size:12px;user-select:none;z-index:10;min-width:185px;transition:opacity 0.3s;}
#ui h3{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:rgba(140,155,190,0.5);margin-bottom:10px;font-weight:500;}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.ctrl-row:last-child{margin-bottom:0;}
.ctrl-row label{font-size:11px;color:rgba(180,188,210,0.75);min-width:62px;}
.ctrl-row input[type=color]{-webkit-appearance:none;border:1px solid rgba(100,120,180,0.2);border-radius:4px;width:28px;height:20px;background:transparent;cursor:pointer;padding:0;}
.ctrl-row input[type=color]::-webkit-color-swatch-wrapper{padding:1px;}
.ctrl-row input[type=color]::-webkit-color-swatch{border-radius:2px;border:none;}
.ctrl-row input[type=range]{-webkit-appearance:none;width:88px;height:3px;background:rgba(80,100,160,0.2);border-radius:2px;outline:none;cursor:pointer;}
.ctrl-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:rgba(170,180,210,0.65);border-radius:50%;cursor:pointer;}
#info{position:fixed;top:15px;left:50%;transform:translateX(-50%);color:rgba(140,155,190,0.3);font-size:10px;letter-spacing:0.5px;z-index:10;font-family:'Segoe UI',system-ui,sans-serif;}
</style>
</head>
<body>
<div id="info">A / D pan · mouse aim · click shoot</div>
<div id="ui">
  <h3>◆ Smoke</h3>
  <div class="ctrl-row"><label>Color</label><input type="color" id="smokeColor" value="#8090b0"></div>
  <div class="ctrl-row"><label>Density</label><input type="range" id="density" min="0" max="100" value="60"></div>
  <div class="ctrl-row"><label>Speed</label><input type="range" id="speed" min="0" max="100" value="40"></div>
  <div class="ctrl-row"><label>Audio</label><input type="range" id="audioReact" min="0" max="100" value="70"></div>
</div>
<canvas id="c"></canvas>

<script>
const CFG = {
  smokeColor: [0.502, 0.565, 0.690],
  density: 0.6,
  speed: 0.4,
  audioReact: 0.7,
  projectileSpeed: 14,
  panSpeed: 3.5,
};

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px">WebGL2 required</p>'; throw 'no gl'; }

let W, H, aspect;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  aspect = W / H;
  gl.viewport(0, 0, W, H);
}
resize();
window.addEventListener('resize', resize);

function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); }
  return s;
}
function createProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); }
  return p;
}

const quadVS = `#version 300 es
in vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const smokeFS = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform float u_time;
uniform vec2 u_res;
uniform vec3 u_smokeColor;
uniform float u_density;
uniform float u_speed;
uniform float u_camX;
uniform float u_aimY;
uniform float u_audioLevel;
uniform float u_bassLevel;

// Impacts: xyz = world pos where projectile hit smoke, w = age since impact
#define MAX_IMP 20
uniform int u_impCount;
uniform vec4 u_imp[MAX_IMP];

// Active flying projectiles: xyz = current world pos, w = age
#define MAX_PROJ 16
uniform int u_projCount;
uniform vec4 u_projPos[MAX_PROJ];

// Rings
#define MAX_RINGS 12
uniform int u_ringCount;
uniform vec4 u_rings[MAX_RINGS];

// ---- Noise ----
vec3 hash3(vec3 p){
  p = vec3(dot(p,vec3(127.1,311.7,74.7)),
           dot(p,vec3(269.5,183.3,246.1)),
           dot(p,vec3(113.5,271.9,124.6)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453);
}

float gnoise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  vec3 u = f*f*(3.0-2.0*f);
  return mix(mix(mix(dot(hash3(i+vec3(0,0,0)),f-vec3(0,0,0)),
                     dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                 mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),
                     dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
             mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),
                     dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                 mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),
                     dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);
}

float fbm(vec3 p){
  float v = 0.0, a = 0.5;
  for(int i = 0; i < 5; i++){
    v += a * gnoise(p);
    p = p * 2.02 + vec3(1.7, 1.2, 0.8);
    a *= 0.5;
  }
  return v;
}

// Domain-warped FBM for more organic turbulence
float warpedFbm(vec3 p, float t){
  vec3 q = vec3(fbm(p + vec3(0.0, 0.0, t * 0.1)),
                fbm(p + vec3(5.2, 1.3, t * 0.08)),
                fbm(p + vec3(1.7, 9.2, t * 0.12)));
  vec3 r = vec3(fbm(p + 4.0 * q + vec3(1.7, 9.2, t * 0.05)),
                fbm(p + 4.0 * q + vec3(8.3, 2.8, t * 0.06)),
                fbm(p + 4.0 * q + vec3(3.1, 6.5, t * 0.07)));
  return fbm(p + 3.5 * r);
}

// Compute impact distortion: displaces the sample point in world space
// to create void + turbulent refill
vec3 impactWarp(vec3 p){
  vec3 totalWarp = vec3(0.0);
  for(int i = 0; i < MAX_IMP; i++){
    if(i >= u_impCount) break;
    vec3 ip = u_imp[i].xyz;
    float age = u_imp[i].w;

    vec3 delta = p - ip;
    float dist = length(delta);
    vec3 dir = dist > 0.001 ? delta / dist : vec3(0.0, 1.0, 0.0);

    // Expanding shockwave radius
    float waveRadius = age * 2.5;
    float waveFront = abs(dist - waveRadius);

    // Push smoke outward from impact center (creates the void)
    float pushStrength = 1.8 * exp(-age * 0.6) / (1.0 + dist * 1.5);
    totalWarp += dir * pushStrength;

    // Rippling waves that propagate outward
    float ripple = sin(dist * 6.0 - age * 8.0) * exp(-waveFront * 2.0) * exp(-age * 0.4);
    totalWarp += dir * ripple * 0.8;

    // Tangential swirl — creates the turbulent mixing as smoke refills
    vec3 tangent = normalize(cross(dir, vec3(0.0, 1.0, 0.3)));
    float swirl = sin(dist * 4.0 - age * 5.0 + age * dist * 2.0) * exp(-dist * 0.8) * exp(-age * 0.3);
    totalWarp += tangent * swirl * 0.6;

    // Vertical turbulence from thermal disruption
    float upBoil = gnoise(p * 3.0 + vec3(0.0, -age * 2.0, 0.0)) * exp(-dist * 0.6) * exp(-age * 0.5);
    totalWarp.y += upBoil * 0.5;
  }
  return totalWarp;
}

// Compute how much density is subtracted (void carving)
float impactVoid(vec3 p){
  float voidAmount = 0.0;
  for(int i = 0; i < MAX_IMP; i++){
    if(i >= u_impCount) break;
    vec3 ip = u_imp[i].xyz;
    float age = u_imp[i].w;
    float dist = length(p - ip);

    // Core void: strong at first, slowly fills back in
    // The void radius expands then contracts as smoke fills back
    float voidRadius = 0.3 + age * 0.8 - age * age * 0.08;
    voidRadius = max(voidRadius, 0.05);
    float core = smoothstep(voidRadius, voidRadius * 0.2, dist);
    float fade = exp(-age * 0.35); // void fills back over time
    voidAmount += core * fade;

    // Shockwave thinning ring
    float waveR = age * 2.5;
    float ringDist = abs(dist - waveR);
    float ring = exp(-ringDist * 4.0) * exp(-age * 0.5) * 0.4;
    voidAmount += ring;
  }
  return clamp(voidAmount, 0.0, 1.0);
}

// Color shift from impacts
vec3 impactColor(vec3 p, vec3 baseCol){
  vec3 col = baseCol;
  for(int i = 0; i < MAX_IMP; i++){
    if(i >= u_impCount) break;
    vec3 ip = u_imp[i].xyz;
    float age = u_imp[i].w;
    float dist = length(p - ip);

    float influence = exp(-dist * 1.5) * exp(-age * 0.25);

    // Hot core: bright warm color at impact, cools outward
    vec3 hotColor = mix(vec3(1.0, 0.6, 0.15), vec3(1.0, 0.85, 0.5), smoothstep(0.0, 1.5, dist));
    col = mix(col, hotColor, influence * 0.8 * exp(-age * 0.5));

    // Expanding ring shows blue-shifted edge
    float waveR = age * 2.5;
    float ringDist = abs(dist - waveR);
    float ringInf = exp(-ringDist * 3.0) * exp(-age * 0.4);
    vec3 coolEdge = vec3(0.3, 0.5, 1.0);
    col = mix(col, coolEdge, ringInf * 0.5);

    // Iridescent shimmer in turbulent zone
    float shimmer = sin(dist * 10.0 + age * 3.0) * 0.5 + 0.5;
    vec3 iridescentCol = mix(vec3(0.6, 0.2, 0.8), vec3(0.2, 0.8, 0.6), shimmer);
    float iridescentInf = exp(-dist * 1.0) * exp(-age * 0.3) * 0.25;
    col = mix(col, iridescentCol, iridescentInf * (1.0 - exp(-age * 2.0)));
  }
  return col;
}

float smokeDensity(vec3 p, float t, bool cheap){
  // Apply impact domain warping FIRST — this physically displaces the smoke
  vec3 warp = impactWarp(p);
  vec3 wp = p + warp;

  // Animated noise coordinates
  vec3 q = wp * 0.9;
  float tSpeed = t * u_speed * 0.25;
  q.y -= tSpeed * 0.6;
  q.x += sin(wp.y * 0.4 + tSpeed) * 0.25;
  q.z += cos(wp.x * 0.3 + tSpeed * 0.7) * 0.15;

  // Density from warped FBM
  float f;
  if(cheap){
    f = fbm(q) * 0.7 + 0.3 * gnoise(q * 2.5);
  } else {
    f = warpedFbm(q, t) * 0.5 + 0.5;
    f += 0.2 * gnoise(q * 3.0 + vec3(t * 0.2));
  }

  // Shape envelope
  float shape = smoothstep(4.0, 0.5, abs(p.x))
              * smoothstep(2.8, 0.0, abs(p.y))
              * smoothstep(2.5, 0.3, p.z)
              * smoothstep(-0.5, 0.3, p.z);

  // Audio pulsation
  shape *= 1.0 + u_bassLevel * 0.5;

  float d = f * shape * u_density * 2.5;

  // Subtract void from impacts
  float v = impactVoid(p);
  d *= (1.0 - v);

  // Ring contributions
  for(int i = 0; i < MAX_RINGS; i++){
    if(i >= u_ringCount) break;
    vec2 rp = u_rings[i].xy;
    float rr = u_rings[i].z;
    float rage = u_rings[i].w;
    float dist2d = length(p.xz - rp);
    float ringD = abs(dist2d - rr);
    float vertFade = exp(-p.y * p.y * 0.5);
    float ring = exp(-ringD * 5.0) * exp(-rage * 1.2) * vertFade * 0.7;
    d += ring;
  }

  return max(d, 0.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - u_res * 0.5) / u_res.y;
  float t = u_time;

  // Camera
  vec3 ro = vec3(u_camX, u_aimY * 0.3, -4.0);
  vec3 rd = normalize(vec3(uv.x, uv.y, 0.85));

  // Raymarch through volume
  vec3 col = vec3(0.015, 0.02, 0.04);
  float transmittance = 1.0;
  float tRay = 1.0; // start a bit in front
  float dt = 0.07;

  for(int i = 0; i < 96; i++){
    if(transmittance < 0.01) break;
    if(tRay > 10.0) break;

    vec3 p = ro + rd * tRay;
    float d = smokeDensity(p, t, false);

    if(d > 0.005){
      // Lighting with cheap shadow sample
      vec3 lightDir = normalize(vec3(0.4, 0.8, -0.3));
      float dLight = smokeDensity(p + lightDir * 0.4, t, true);
      float shadow = exp(-max(dLight - d, 0.0) * 4.0);

      // Base color + impact color shifts
      vec3 smokeCol = impactColor(p, u_smokeColor);

      // Audio color tint
      smokeCol += vec3(0.04, 0.015, 0.07) * u_audioLevel;

      // Ambient + lit
      vec3 ambient = smokeCol * 0.25;
      vec3 lit = smokeCol * shadow * 0.75;
      vec3 scatterCol = ambient + lit;

      // Slight back-scatter highlight
      float backScatter = pow(max(dot(rd, lightDir), 0.0), 3.0) * 0.15;
      scatterCol += vec3(1.0, 0.9, 0.7) * backScatter * shadow;

      float alpha = 1.0 - exp(-d * dt * 7.0);
      col += transmittance * alpha * scatterCol;
      transmittance *= (1.0 - alpha);
    }

    tRay += dt;
  }

  // Flying projectile glow (in-scene)
  for(int i = 0; i < MAX_PROJ; i++){
    if(i >= u_projCount) break;
    vec3 pp = u_projPos[i].xyz;
    float age = u_projPos[i].w;
    // Project to screen
    vec3 rel = pp - ro;
    if(rel.z < 0.1) continue;
    vec2 projected = rel.xy / rel.z * 0.85;
    float screenDist = length(uv - projected);
    float glow = 0.015 / (screenDist * screenDist + 0.002) * exp(-age * 0.3);
    glow = min(glow, 2.0);
    col += vec3(1.0, 0.65, 0.2) * glow * transmittance * 0.15;
  }

  // Vignette
  vec2 vc = gl_FragCoord.xy / u_res - 0.5;
  col *= 1.0 - 0.35 * dot(vc, vc);

  // Tonemap
  col = col / (1.0 + col);
  col = pow(col, vec3(0.92));

  fragColor = vec4(col, 1.0);
}`;

// --- Build program ---
const prog = createProgram(
  createShader(gl.VERTEX_SHADER, quadVS),
  createShader(gl.FRAGMENT_SHADER, smokeFS)
);

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Uniform cache
const U = {};
function loc(n){ U[n] = gl.getUniformLocation(prog, n); }
['u_time','u_res','u_smokeColor','u_density','u_speed','u_camX','u_aimY',
 'u_audioLevel','u_bassLevel','u_impCount','u_projCount','u_ringCount'].forEach(loc);
for(let i=0;i<20;i++) loc('u_imp['+i+']');
for(let i=0;i<16;i++) loc('u_projPos['+i+']');
for(let i=0;i<12;i++) loc('u_rings['+i+']');

// --- State ---
let camX = 0, aimY = 0, mouseNDCx = 0, mouseNDCy = 0;
const keys = {};
const projectiles = []; // flying bullets
const impacts = [];     // where bullets hit smoke
const rings = [];
let audioLevel = 0, bassLevel = 0, lastRingTime = 0;
let audioCtx, analyser, dataArray;

// --- Audio ---
async function initAudio(){
  try {
    audioCtx = new AudioContext();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  } catch(e){ console.log('No mic, synthetic pulse'); }
}

function updateAudio(t){
  if(analyser && dataArray){
    analyser.getByteFrequencyData(dataArray);
    let sum = 0, bass = 0;
    for(let i = 0; i < dataArray.length; i++){
      sum += dataArray[i];
      if(i < 10) bass += dataArray[i];
    }
    audioLevel = (sum / dataArray.length / 255) * CFG.audioReact;
    bassLevel = (bass / 10 / 255) * CFG.audioReact;
  } else {
    audioLevel = (0.12 + 0.08 * Math.sin(t * 1.3)) * CFG.audioReact;
    bassLevel = (0.18 + 0.12 * Math.sin(t * 0.7)) * CFG.audioReact;
  }
}

// --- Input ---
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => {
  // NDC coords matching the shader's uv calculation
  mouseNDCx = (e.clientX - W * 0.5) / H;
  mouseNDCy = (H * 0.5 - e.clientY) / H;
  aimY = mouseNDCy * 2.0;
});

function shootProjectile(){
  // Ray direction matching exactly what the shader does
  const rdx = mouseNDCx;
  const rdy = mouseNDCy;
  const rdz = 0.85;
  const len = Math.sqrt(rdx*rdx + rdy*rdy + rdz*rdz);
  const dx = rdx/len, dy = rdy/len, dz = rdz/len;

  projectiles.push({
    x: camX, y: aimY * 0.3, z: -4.0,
    vx: dx * CFG.projectileSpeed,
    vy: dy * CFG.projectileSpeed,
    vz: dz * CFG.projectileSpeed,
    age: 0, hit: false
  });
}

canvas.addEventListener('mousedown', e => {
  if(e.button === 0) shootProjectile();
});
// Prevent UI panel clicks from also shooting
document.getElementById('ui').addEventListener('mousedown', e => e.stopPropagation());

// --- UI ---
document.getElementById('smokeColor').addEventListener('input', e => {
  const h = e.target.value;
  CFG.smokeColor = [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
});
document.getElementById('density').addEventListener('input', e => CFG.density = e.target.value / 100);
document.getElementById('speed').addEventListener('input', e => CFG.speed = e.target.value / 100);
document.getElementById('audioReact').addEventListener('input', e => CFG.audioReact = e.target.value / 100);

// --- Loop ---
let prevT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const t = now * 0.001;
  const dt = Math.min(t - prevT, 0.05);
  prevT = t;

  if(keys['a']) camX -= CFG.panSpeed * dt;
  if(keys['d']) camX += CFG.panSpeed * dt;

  updateAudio(t);

  // Rings on low audio
  if(audioLevel < 0.12 * CFG.audioReact + 0.04){
    if(t - lastRingTime > 1.4){
      rings.push({ x: -4.0 + camX, z: 0.8, radius: 0.1, age: 0 });
      rings.push({ x:  4.0 + camX, z: 0.8, radius: 0.1, age: 0 });
      lastRingTime = t;
    }
  }

  // Update rings
  for(let i = rings.length - 1; i >= 0; i--){
    rings[i].age += dt;
    rings[i].radius += dt * 1.8;
    if(rings[i].age > 3.5) rings.splice(i, 1);
  }

  // Update projectiles — ray-march style hit test against the smoke volume bounds
  for(let i = projectiles.length - 1; i >= 0; i--){
    const p = projectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    p.age += dt;

    // Smoke volume is roughly: |x-camX| < 4, |y| < 2.8, z in [-0.5, 2.5]
    // Register impact when projectile enters the volume
    if(!p.hit && p.z > -0.3 && p.z < 2.8 && Math.abs(p.x) < 5.0 && Math.abs(p.y) < 3.5){
      p.hit = true;
      impacts.push({ x: p.x, y: p.y, z: p.z, age: 0 });
    }

    if(p.age > 3.0 || p.z > 12.0) projectiles.splice(i, 1);
  }

  // Update impacts
  for(let i = impacts.length - 1; i >= 0; i--){
    impacts[i].age += dt;
    if(impacts[i].age > 8.0) impacts.splice(i, 1);
  }

  // --- Render ---
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  gl.uniform1f(U.u_time, t);
  gl.uniform2f(U.u_res, W, H);
  gl.uniform3fv(U.u_smokeColor, CFG.smokeColor);
  gl.uniform1f(U.u_density, CFG.density);
  gl.uniform1f(U.u_speed, CFG.speed);
  gl.uniform1f(U.u_camX, camX);
  gl.uniform1f(U.u_aimY, aimY);
  gl.uniform1f(U.u_audioLevel, audioLevel);
  gl.uniform1f(U.u_bassLevel, bassLevel);

  const ic = Math.min(impacts.length, 20);
  gl.uniform1i(U.u_impCount, ic);
  for(let i = 0; i < ic; i++)
    gl.uniform4f(U['u_imp['+i+']'], impacts[i].x, impacts[i].y, impacts[i].z, impacts[i].age);

  const pc = Math.min(projectiles.length, 16);
  gl.uniform1i(U.u_projCount, pc);
  for(let i = 0; i < pc; i++)
    gl.uniform4f(U['u_projPos['+i+']'], projectiles[i].x, projectiles[i].y, projectiles[i].z, projectiles[i].age);

  const rc = Math.min(rings.length, 12);
  gl.uniform1i(U.u_ringCount, rc);
  for(let i = 0; i < rc; i++)
    gl.uniform4f(U['u_rings['+i+']'], rings[i].x, rings[i].z, rings[i].radius, rings[i].age);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

initAudio();
requestAnimationFrame(frame);
</script>
</body>
</html>
