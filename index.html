<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Smoke</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;cursor:crosshair;font-family:'Segoe UI',system-ui,sans-serif;}
canvas{display:block;}
#ui{position:fixed;bottom:20px;left:20px;background:rgba(15,18,35,0.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(100,120,180,0.15);border-radius:10px;padding:14px 18px;color:rgba(210,215,230,0.9);font-size:12px;user-select:none;z-index:10;min-width:180px;transition:opacity 0.3s;}
#ui h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(160,170,200,0.6);margin-bottom:10px;font-weight:500;}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.ctrl-row label{font-size:11px;color:rgba(190,195,215,0.8);}
.ctrl-row input[type=color]{-webkit-appearance:none;border:1px solid rgba(100,120,180,0.25);border-radius:4px;width:28px;height:20px;background:transparent;cursor:pointer;padding:0;}
.ctrl-row input[type=color]::-webkit-color-swatch-wrapper{padding:1px;}
.ctrl-row input[type=color]::-webkit-color-swatch{border-radius:2px;border:none;}
.ctrl-row input[type=range]{-webkit-appearance:none;width:90px;height:3px;background:rgba(100,120,180,0.25);border-radius:2px;outline:none;cursor:pointer;}
.ctrl-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:rgba(180,190,220,0.7);border-radius:50%;cursor:pointer;}
#crosshair{position:fixed;pointer-events:none;z-index:5;}
#info{position:fixed;top:15px;left:50%;transform:translateX(-50%);color:rgba(160,170,200,0.35);font-size:10px;letter-spacing:0.5px;z-index:10;font-family:'Segoe UI',system-ui,sans-serif;}
</style>
</head>
<body>
<div id="info">A / D pan &bull; mouse aim &bull; click shoot</div>
<div id="ui">
  <h3>&#9670; Smoke</h3>
  <div class="ctrl-row"><label>Color</label><input type="color" id="smokeColor" value="#8090b0"></div>
  <div class="ctrl-row"><label>Density</label><input type="range" id="density" min="0" max="100" value="60"></div>
  <div class="ctrl-row"><label>Speed</label><input type="range" id="speed" min="0" max="100" value="40"></div>
  <div class="ctrl-row"><label>Audio React</label><input type="range" id="audioReact" min="0" max="100" value="70"></div>
</div>
<canvas id="c"></canvas>

<script>
// --- Config ---
const CFG = {
  smokeColor: [0.502, 0.565, 0.690],
  density: 0.6,
  speed: 0.4,
  audioReact: 0.7,
  maxParticles: 600,
  projectileSpeed: 18,
  panSpeed: 3.5,
};

// --- Canvas & GL ---
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, premultipliedAlpha: false });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px">WebGL2 required</p>'; throw 'no gl'; }

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  gl.viewport(0, 0, W, H);
}
resize();
window.addEventListener('resize', resize);

// --- Shaders ---
function createShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
  return s;
}
function createProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return null; }
  return p;
}

// Full-screen quad
const quadVS = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main(){
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

// Smoke raymarching shader
const smokeFS = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform float u_time;
uniform vec2 u_res;
uniform vec3 u_smokeColor;
uniform float u_density;
uniform float u_speed;
uniform float u_camX;
uniform float u_aimY;

#define MAX_PROJ 16
uniform int u_projCount;
uniform vec4 u_proj[MAX_PROJ]; // xyz=pos, w=age

#define MAX_RINGS 12
uniform int u_ringCount;
uniform vec4 u_rings[MAX_RINGS]; // xy=pos, z=radius, w=age

uniform float u_audioLevel;
uniform float u_bassLevel;

// Noise functions
float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}

float noise3D(vec3 p){
  vec3 i=floor(p), f=fract(p);
  f=f*f*(3.0-2.0*f);
  float n= mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),
                    mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                    mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
  return n;
}

float fbm(vec3 p){
  float v=0.0, a=0.5;
  vec3 shift=vec3(100.0);
  for(int i=0;i<5;i++){
    v+=a*noise3D(p);
    p=p*2.0+shift;
    a*=0.5;
  }
  return v;
}

float smokeDensity(vec3 p){
  float t = u_time * u_speed * 0.3;
  vec3 q = p * 1.2;
  q.y -= t * 0.5;
  q.x += sin(p.y * 0.3 + t) * 0.3;

  float f = fbm(q);
  f += 0.5 * fbm(q * 2.0 + vec3(t * 0.1));

  // Base shape - wide slab
  float shape = smoothstep(3.5, 0.0, abs(p.x)) * smoothstep(2.5, 0.0, abs(p.y)) * smoothstep(1.5, 0.2, p.z);

  // Audio pulsation
  float pulse = 1.0 + u_bassLevel * 0.4;
  shape *= pulse;

  float d = f * shape * u_density * 2.0;

  // Projectile distortion
  for(int i=0; i<MAX_PROJ; i++){
    if(i >= u_projCount) break;
    vec3 pp = u_proj[i].xyz;
    float age = u_proj[i].w;
    float dist = length(p - pp);
    float ripple = sin(dist * 8.0 - age * 12.0) * exp(-dist * 1.5) * exp(-age * 0.8);
    d += ripple * 0.4;
    // Carve hole
    d *= smoothstep(0.0, 0.6 + age * 0.5, dist);
  }

  // Ring distortion
  for(int i=0; i<MAX_RINGS; i++){
    if(i >= u_ringCount) break;
    vec2 rp = u_rings[i].xy;
    float rr = u_rings[i].z;
    float rage = u_rings[i].w;
    float dist2d = length(p.xz - rp);
    float ringD = abs(dist2d - rr);
    float ring = exp(-ringD * 4.0) * exp(-rage * 1.5) * (1.0 - rage * 0.5);
    d += ring * 0.6;
  }

  return max(d, 0.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - u_res * 0.5) / u_res.y;

  // Camera
  vec3 ro = vec3(u_camX, u_aimY * 0.5, -3.0);
  vec3 rd = normalize(vec3(uv, 1.0));

  // Raymarch
  vec3 col = vec3(0.02, 0.025, 0.045); // dark bg
  float transmittance = 1.0;
  float t_ray = 0.0;
  float dt = 0.08;

  for(int i=0; i<80; i++){
    vec3 p = ro + rd * t_ray;
    float d = smokeDensity(p);

    if(d > 0.01){
      // Lighting
      vec3 lightDir = normalize(vec3(0.3, 1.0, -0.5));
      float lightD = smokeDensity(p + lightDir * 0.3);
      float shadow = exp(-(lightD - d) * 3.0);

      vec3 smokeCol = u_smokeColor;

      // Color shift near projectiles
      for(int j=0; j<MAX_PROJ; j++){
        if(j >= u_projCount) break;
        float pd = length(p - u_proj[j].xyz);
        float age = u_proj[j].w;
        float influence = exp(-pd * 2.0) * exp(-age * 0.6);
        smokeCol = mix(smokeCol, vec3(0.9, 0.5, 0.2), influence * 0.7);
        smokeCol = mix(smokeCol, vec3(0.3, 0.6, 1.0), influence * 0.3 * sin(age * 5.0 + pd * 3.0));
      }

      // Audio color tint
      smokeCol += vec3(0.05, 0.02, 0.08) * u_audioLevel;

      vec3 lit = smokeCol * (0.3 + 0.7 * shadow);
      float alpha = (1.0 - exp(-d * dt * 6.0));
      col += transmittance * alpha * lit;
      transmittance *= (1.0 - alpha);
    }

    if(transmittance < 0.01) break;
    t_ray += dt;
    if(t_ray > 8.0) break;
  }

  // Vignette
  float vig = 1.0 - 0.4 * length((gl_FragCoord.xy / u_res - 0.5) * vec2(1.2, 1.0));
  col *= vig;

  // Tone map
  col = col / (1.0 + col);
  col = pow(col, vec3(0.9));

  fragColor = vec4(col, 1.0);
}`;

// Projectile glow shader
const projFS = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;
uniform vec2 u_res;
uniform float u_time;

#define MAX_PROJ 16
uniform int u_projCount;
uniform vec3 u_projScreen[MAX_PROJ];

void main(){
  vec2 px = gl_FragCoord.xy;
  vec3 col = vec3(0.0);
  float a = 0.0;

  for(int i=0; i<MAX_PROJ; i++){
    if(i >= u_projCount) break;
    vec2 pp = u_projScreen[i].xy;
    float age = u_projScreen[i].z;
    if(age > 3.0) continue;
    float d = length(px - pp);
    float glow = exp(-d * 0.04) * exp(-age * 0.5) * 0.6;
    col += vec3(1.0, 0.7, 0.3) * glow;
    a = max(a, glow);
  }

  fragColor = vec4(col, a);
}`;

// Build programs
const smokeVS = createShader(gl.VERTEX_SHADER, quadVS);
const smokeFSc = createShader(gl.FRAGMENT_SHADER, smokeFS);
const smokeProg = createProgram(smokeVS, smokeFSc);

const projVS = createShader(gl.VERTEX_SHADER, quadVS);
const projFSc = createShader(gl.FRAGMENT_SHADER, projFS);
const projProg = createProgram(projVS, projFSc);

// Quad buffer
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

function setupQuad(prog) {
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

// Uniform locations
const sU = {};
['u_time','u_res','u_smokeColor','u_density','u_speed','u_camX','u_aimY',
 'u_projCount','u_audioLevel','u_bassLevel','u_ringCount'].forEach(n => sU[n] = gl.getUniformLocation(smokeProg, n));
for(let i=0;i<16;i++) sU['u_proj'+i] = gl.getUniformLocation(smokeProg, `u_proj[${i}]`);
for(let i=0;i<12;i++) sU['u_rings'+i] = gl.getUniformLocation(smokeProg, `u_rings[${i}]`);

const pU = {};
pU.u_res = gl.getUniformLocation(projProg, 'u_res');
pU.u_time = gl.getUniformLocation(projProg, 'u_time');
pU.u_projCount = gl.getUniformLocation(projProg, 'u_projCount');
for(let i=0;i<16;i++) pU['u_projScreen'+i] = gl.getUniformLocation(projProg, `u_projScreen[${i}]`);

// --- State ---
let camX = 0, aimY = 0;
let mouseX = 0.5, mouseY = 0.5;
const keys = {};
const projectiles = []; // {x,y,z,vx,vy,vz,age}
const impacts = []; // {x,y,z,age}
const rings = []; // {x,z,radius,age}
let audioLevel = 0, bassLevel = 0;
let lastRingTime = 0;
let audioCtx, analyser, dataArray, source;

// --- Audio ---
async function initAudio() {
  try {
    audioCtx = new AudioContext();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.7;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  } catch(e) {
    console.log('Audio not available, using synthetic pulse');
  }
}

function updateAudio(t) {
  if (analyser && dataArray) {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0, bassSum = 0;
    for(let i = 0; i < dataArray.length; i++) {
      sum += dataArray[i];
      if(i < 8) bassSum += dataArray[i];
    }
    audioLevel = (sum / dataArray.length / 255) * CFG.audioReact;
    bassLevel = (bassSum / 8 / 255) * CFG.audioReact;
  } else {
    // Synthetic gentle pulse
    audioLevel = (0.15 + 0.1 * Math.sin(t * 1.5)) * CFG.audioReact;
    bassLevel = (0.2 + 0.15 * Math.sin(t * 0.8)) * CFG.audioReact;
  }
}

// --- Input ---
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => {
  mouseX = e.clientX / W;
  mouseY = e.clientY / H;
  aimY = (0.5 - mouseY) * 2.0;
});

canvas.addEventListener('click', e => {
  const dx = (mouseX - 0.5) * 2.0 * (W / H);
  const dy = (0.5 - mouseY) * 2.0;
  const dir = normalize3(dx, dy, 1.0);
  projectiles.push({
    x: camX, y: aimY * 0.5, z: -3.0,
    vx: dir[0] * CFG.projectileSpeed,
    vy: dir[1] * CFG.projectileSpeed,
    vz: dir[2] * CFG.projectileSpeed,
    age: 0, hit: false
  });
});

function normalize3(x,y,z){const l=Math.sqrt(x*x+y*y+z*z);return[x/l,y/l,z/l];}

// --- UI bindings ---
document.getElementById('smokeColor').addEventListener('input', e => {
  const hex = e.target.value;
  CFG.smokeColor = [parseInt(hex.slice(1,3),16)/255, parseInt(hex.slice(3,5),16)/255, parseInt(hex.slice(5,7),16)/255];
});
document.getElementById('density').addEventListener('input', e => CFG.density = e.target.value / 100);
document.getElementById('speed').addEventListener('input', e => CFG.speed = e.target.value / 100);
document.getElementById('audioReact').addEventListener('input', e => CFG.audioReact = e.target.value / 100);

// --- Game loop ---
let prevTime = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t = now * 0.001;
  const dt = Math.min(t - prevTime, 0.05);
  prevTime = t;

  // Input
  if(keys['a']) camX -= CFG.panSpeed * dt;
  if(keys['d']) camX += CFG.panSpeed * dt;

  // Update audio
  updateAudio(t);

  // Smoke rings from sides on low emission
  if(audioLevel < 0.15 * CFG.audioReact + 0.05) {
    if(t - lastRingTime > 1.2) {
      rings.push({ x: -3.5 + camX, z: 0.5, radius: 0.1, age: 0 });
      rings.push({ x: 3.5 + camX, z: 0.5, radius: 0.1, age: 0 });
      lastRingTime = t;
    }
  }

  // Update rings
  for(let i = rings.length - 1; i >= 0; i--) {
    rings[i].age += dt;
    rings[i].radius += dt * 1.5;
    if(rings[i].age > 3.0) rings.splice(i, 1);
  }

  // Update projectiles
  for(let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;
    p.age += dt;

    // Check if inside smoke volume
    if(!p.hit && Math.abs(p.x - camX) < 3.5 && Math.abs(p.y) < 2.5 && p.z > 0.2 && p.z < 1.5) {
      p.hit = true;
      impacts.push({ x: p.x, y: p.y, z: p.z, age: 0 });
    }

    if(p.age > 4.0 || p.z > 10.0) projectiles.splice(i, 1);
  }

  // Update impacts
  for(let i = impacts.length - 1; i >= 0; i--) {
    impacts[i].age += dt;
    if(impacts[i].age > 5.0) impacts.splice(i, 1);
  }

  // --- Render smoke ---
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);

  gl.useProgram(smokeProg);
  setupQuad(smokeProg);

  gl.uniform1f(sU.u_time, t);
  gl.uniform2f(sU.u_res, W, H);
  gl.uniform3fv(sU.u_smokeColor, CFG.smokeColor);
  gl.uniform1f(sU.u_density, CFG.density);
  gl.uniform1f(sU.u_speed, CFG.speed);
  gl.uniform1f(sU.u_camX, camX);
  gl.uniform1f(sU.u_aimY, aimY);
  gl.uniform1f(sU.u_audioLevel, audioLevel);
  gl.uniform1f(sU.u_bassLevel, bassLevel);

  // Impacts
  const impactCount = Math.min(impacts.length, 16);
  gl.uniform1i(sU.u_projCount, impactCount);
  for(let i = 0; i < impactCount; i++) {
    gl.uniform4f(sU['u_proj'+i], impacts[i].x, impacts[i].y, impacts[i].z, impacts[i].age);
  }

  // Rings
  const ringCount = Math.min(rings.length, 12);
  gl.uniform1i(sU.u_ringCount, ringCount);
  for(let i = 0; i < ringCount; i++) {
    gl.uniform4f(sU['u_rings'+i], rings[i].x, rings[i].z, rings[i].radius, rings[i].age);
  }

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // --- Render projectile glows (additive) ---
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

  gl.useProgram(projProg);
  setupQuad(projProg);

  gl.uniform2f(pU.u_res, W, H);
  gl.uniform1f(pU.u_time, t);

  const activeProjCount = Math.min(projectiles.length, 16);
  gl.uniform1i(pU.u_projCount, activeProjCount);
  for(let i = 0; i < activeProjCount; i++) {
    const p = projectiles[i];
    // Project to screen
    const relX = p.x - camX;
    const relY = p.y - aimY * 0.5;
    const relZ = p.z + 3.0; // camera at z=-3
    if(relZ <= 0.01) { gl.uniform3f(pU['u_projScreen'+i], -9999, -9999, 99); continue; }
    const sx = (relX / relZ) * H * 0.5 + W * 0.5;
    const sy = H * 0.5 - (relY / relZ) * H * 0.5;
    gl.uniform3f(pU['u_projScreen'+i], sx, sy, p.age);
  }

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.disable(gl.BLEND);
}

// Start
initAudio();
requestAnimationFrame(frame);
</script>
</body>
</html>
