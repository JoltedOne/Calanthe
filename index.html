<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Smoke</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;cursor:crosshair;font-family:'Segoe UI',system-ui,sans-serif;}
canvas{display:block;}
#ui{position:fixed;bottom:20px;left:20px;background:rgba(12,15,30,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(80,100,160,0.12);border-radius:10px;padding:14px 18px;color:rgba(210,215,230,0.9);font-size:12px;user-select:none;z-index:10;min-width:185px;}
#ui h3{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:rgba(140,155,190,0.5);margin-bottom:10px;font-weight:500;}
.cr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.cr:last-child{margin-bottom:0;}
.cr label{font-size:11px;color:rgba(180,188,210,0.75);min-width:62px;}
.cr input[type=color]{-webkit-appearance:none;border:1px solid rgba(100,120,180,0.2);border-radius:4px;width:28px;height:20px;background:transparent;cursor:pointer;padding:0;}
.cr input[type=color]::-webkit-color-swatch-wrapper{padding:1px;}
.cr input[type=color]::-webkit-color-swatch{border-radius:2px;border:none;}
.cr input[type=range]{-webkit-appearance:none;width:88px;height:3px;background:rgba(80,100,160,0.2);border-radius:2px;outline:none;cursor:pointer;}
.cr input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;background:rgba(170,180,210,0.65);border-radius:50%;cursor:pointer;}
#info{position:fixed;top:15px;left:50%;transform:translateX(-50%);color:rgba(140,155,190,0.3);font-size:10px;letter-spacing:0.5px;z-index:10;font-family:'Segoe UI',system-ui,sans-serif;}
</style>
</head>
<body>
<div id="info">WASD move · mouse aim · click shoot</div>
<div id="ui">
  <h3>&#9670; Smoke</h3>
  <div class="cr"><label>Color</label><input type="color" id="smokeColor" value="#8090b0"></div>
  <div class="cr"><label>Density</label><input type="range" id="density" min="0" max="100" value="60"></div>
  <div class="cr"><label>Speed</label><input type="range" id="speed" min="0" max="100" value="40"></div>
  <div class="cr"><label>Audio</label><input type="range" id="audioReact" min="0" max="100" value="70"></div>
</div>
<canvas id="c"></canvas>

<script>
// ============================================================
// CONFIG
// ============================================================
const CFG = {
  smokeColor: [0.502, 0.565, 0.690],
  density: 0.6,
  speed: 0.4,
  audioReact: 0.7,
  panSpeed: 3.5,
  moveSpeed: 3.0,
  gravity: -4.0,
  projectileSpeed: 1800,
  maxParticles: 3000,
  emitRate: 80, // particles/sec base
};

// ============================================================
// GL
// ============================================================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {
  alpha: false, antialias: false, premultipliedAlpha: false,
  preserveDrawingBuffer: false
});
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px">WebGL2 required</p>'; throw 'no gl'; }

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  gl.viewport(0, 0, W, H);
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// GENERATE SMOKE SPRITE TEXTURES (wispy tendril atlas)
// ============================================================
function generateSmokeAtlas() {
  const size = 256;
  const tiles = 4; // 4x4 atlas = 16 variants
  const full = size * tiles;
  const c2d = document.createElement('canvas').getContext('2d');
  c2d.canvas.width = full;
  c2d.canvas.height = full;

  for (let ty = 0; ty < tiles; ty++) {
    for (let tx = 0; tx < tiles; tx++) {
      const ox = tx * size, oy = ty * size;
      const cx = ox + size/2, cy = oy + size/2;
      const seed = ty * tiles + tx;

      // Multiple overlapping radial gradient tendrils
      const tendrilCount = 3 + (seed % 4);
      for (let t = 0; t < tendrilCount; t++) {
        const angle = (t / tendrilCount) * Math.PI * 2 + seed * 0.7;
        const len = size * (0.2 + 0.25 * Math.sin(seed * 1.3 + t));
        // Curl offset
        const curlX = Math.cos(angle + Math.sin(seed + t) * 1.5) * len;
        const curlY = Math.sin(angle + Math.cos(seed * 0.7 + t) * 1.5) * len;

        const grad = c2d.createRadialGradient(
          cx + curlX * 0.3, cy + curlY * 0.3, 0,
          cx + curlX * 0.15, cy + curlY * 0.15, size * (0.25 + 0.15 * Math.sin(seed + t))
        );
        grad.addColorStop(0, `rgba(255,255,255,${0.12 + 0.06 * Math.sin(seed + t)})`);
        grad.addColorStop(0.4, `rgba(255,255,255,${0.06 + 0.03 * Math.cos(seed * 2 + t)})`);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        c2d.fillStyle = grad;
        c2d.fillRect(ox, oy, size, size);
      }

      // Central soft core
      const core = c2d.createRadialGradient(cx, cy, 0, cx, cy, size * 0.35);
      core.addColorStop(0, `rgba(255,255,255,${0.15 + 0.05 * (seed % 3)})`);
      core.addColorStop(0.5, 'rgba(255,255,255,0.05)');
      core.addColorStop(1, 'rgba(255,255,255,0)');
      c2d.fillStyle = core;
      c2d.fillRect(ox, oy, size, size);

      // Wispy edge tendrils using arcs
      c2d.save();
      c2d.globalCompositeOperation = 'lighter';
      for (let w = 0; w < 5 + seed % 3; w++) {
        const a1 = (w / 7) * Math.PI * 2 + seed;
        const r = size * (0.12 + 0.18 * Math.sin(seed * 0.5 + w));
        c2d.beginPath();
        c2d.arc(cx + Math.cos(a1) * r * 0.5, cy + Math.sin(a1) * r * 0.5, r, a1, a1 + 1.5 + Math.sin(w + seed) * 0.8);
        c2d.lineWidth = 3 + seed % 4;
        c2d.strokeStyle = `rgba(255,255,255,${0.03 + 0.02 * Math.sin(w + seed)})`;
        c2d.stroke();
      }
      c2d.restore();
    }
  }

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c2d.canvas);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}
const smokeTex = generateSmokeAtlas();

// ============================================================
// SHADERS
// ============================================================
function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function mkProgram(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, mkShader(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}

// --- Smoke particle instanced shader ---
const SMOKE_VS = `#version 300 es
precision highp float;

// Per-vertex (unit quad)
in vec2 a_quad;

// Per-instance
in vec3 a_pos;       // world XY + depth(Z for parallax)
in vec4 a_params;    // rotation, scale, opacity, tileIndex
in vec3 a_color;     // tinted color
in vec2 a_deform;    // curl deformation XY offset

uniform vec2 u_res;
uniform vec2 u_cam;   // camera XY offset
uniform float u_camZ;  // camera Z (forward/back)

out vec2 v_uv;
out float v_opacity;
out vec3 v_color;
out float v_tile;

void main(){
  float rot = a_params.x;
  float scale = a_params.y;
  float opacity = a_params.z;
  v_tile = a_params.w;
  v_opacity = opacity;
  v_color = a_color;

  // Parallax: particles at different Z depths move differently with camera
  float depth = a_pos.z; // 0=far, 1=near
  float parallax = 0.5 + depth * 0.5;
  float sizeScale = 0.7 + depth * 0.3;

  vec2 worldPos = a_pos.xy - u_cam * parallax;

  // Add curl deformation
  worldPos += a_deform;

  // Camera Z affects scale (pseudo-perspective)
  float zInfluence = 1.0 + u_camZ * 0.08 * parallax;
  float finalScale = scale * sizeScale * zInfluence;

  // Rotate quad
  float c = cos(rot), s = sin(rot);
  vec2 rotated = vec2(a_quad.x * c - a_quad.y * s, a_quad.x * s + a_quad.y * c);

  vec2 screenPos = worldPos + rotated * finalScale;

  // To clip space
  vec2 clip = screenPos / u_res * 2.0;

  gl_Position = vec4(clip, depth * 0.5, 1.0);
  v_uv = a_quad * 0.5 + 0.5;
}`;

const SMOKE_FS = `#version 300 es
precision highp float;

in vec2 v_uv;
in float v_opacity;
in vec3 v_color;
in float v_tile;

uniform sampler2D u_atlas;

out vec4 fragColor;

void main(){
  // Pick tile from 4x4 atlas
  float tileIdx = floor(v_tile);
  float tx = mod(tileIdx, 4.0) / 4.0;
  float ty = floor(tileIdx / 4.0) / 4.0;
  vec2 atlasUV = vec2(tx, ty) + v_uv / 4.0;

  vec4 smoke = texture(u_atlas, atlasUV);
  float alpha = smoke.r * v_opacity;

  // Soft edges: extra radial falloff for rounder particles
  float dist = length(v_uv - 0.5) * 2.0;
  alpha *= smoothstep(1.0, 0.3, dist);

  fragColor = vec4(v_color * alpha, alpha);
}`;

// --- Projectile shader (simple glow circles) ---
const PROJ_VS = `#version 300 es
precision highp float;
in vec2 a_quad;
in vec3 a_projPos; // screen XY + age
in float a_projRadius;
uniform vec2 u_res;
out vec2 v_uv;
out float v_age;
void main(){
  v_uv = a_quad;
  v_age = a_projPos.z;
  vec2 pos = a_projPos.xy + a_quad * a_projRadius;
  gl_Position = vec4(pos / u_res * 2.0, 0.0, 1.0);
}`;

const PROJ_FS = `#version 300 es
precision highp float;
in vec2 v_uv;
in float v_age;
out vec4 fragColor;
void main(){
  float d = length(v_uv);
  float glow = exp(-d * 3.0) * 0.9 + exp(-d * 8.0) * 0.5;
  glow *= exp(-v_age * 0.4);
  vec3 col = mix(vec3(1.0, 0.7, 0.2), vec3(1.0, 0.4, 0.1), d);
  fragColor = vec4(col * glow, glow);
}`;

const smokeProg = mkProgram(SMOKE_VS, SMOKE_FS);
const projProg = mkProgram(PROJ_VS, PROJ_FS);

// ============================================================
// BUFFERS — instanced rendering
// ============================================================
const MAX_P = CFG.maxParticles;

// Unit quad: [-1,-1] to [1,1]
const quadVerts = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);

// Instance data buffers (interleaved would be faster but separate is simpler)
const posData = new Float32Array(MAX_P * 3);     // x, y, z
const paramData = new Float32Array(MAX_P * 4);   // rot, scale, opacity, tile
const colorData = new Float32Array(MAX_P * 3);   // r, g, b
const deformData = new Float32Array(MAX_P * 2);  // deform x, y

const posBuf = gl.createBuffer();
const paramBuf = gl.createBuffer();
const colorBuf = gl.createBuffer();
const deformBuf = gl.createBuffer();

// Smoke VAO
const smokeVAO = gl.createVertexArray();
gl.bindVertexArray(smokeVAO);

// Quad verts (per-vertex)
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
const aQuadS = gl.getAttribLocation(smokeProg, 'a_quad');
gl.enableVertexAttribArray(aQuadS);
gl.vertexAttribPointer(aQuadS, 2, gl.FLOAT, false, 0, 0);

// Per-instance attributes
gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
const aPosS = gl.getAttribLocation(smokeProg, 'a_pos');
gl.enableVertexAttribArray(aPosS);
gl.vertexAttribPointer(aPosS, 3, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(aPosS, 1);

gl.bindBuffer(gl.ARRAY_BUFFER, paramBuf);
const aParamsS = gl.getAttribLocation(smokeProg, 'a_params');
gl.enableVertexAttribArray(aParamsS);
gl.vertexAttribPointer(aParamsS, 4, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(aParamsS, 1);

gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
const aColorS = gl.getAttribLocation(smokeProg, 'a_color');
gl.enableVertexAttribArray(aColorS);
gl.vertexAttribPointer(aColorS, 3, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(aColorS, 1);

gl.bindBuffer(gl.ARRAY_BUFFER, deformBuf);
const aDeformS = gl.getAttribLocation(smokeProg, 'a_deform');
gl.enableVertexAttribArray(aDeformS);
gl.vertexAttribPointer(aDeformS, 2, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(aDeformS, 1);

gl.bindVertexArray(null);

// Projectile VAO
const MAX_PROJECTILES = 32;
const projPosData = new Float32Array(MAX_PROJECTILES * 3);
const projRadData = new Float32Array(MAX_PROJECTILES);
const projPosBuf = gl.createBuffer();
const projRadBuf = gl.createBuffer();

const projVAO = gl.createVertexArray();
gl.bindVertexArray(projVAO);

gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
const aQuadP = gl.getAttribLocation(projProg, 'a_quad');
gl.enableVertexAttribArray(aQuadP);
gl.vertexAttribPointer(aQuadP, 2, gl.FLOAT, false, 0, 0);

gl.bindBuffer(gl.ARRAY_BUFFER, projPosBuf);
const aProjPos = gl.getAttribLocation(projProg, 'a_projPos');
gl.enableVertexAttribArray(aProjPos);
gl.vertexAttribPointer(aProjPos, 3, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(aProjPos, 1);

gl.bindBuffer(gl.ARRAY_BUFFER, projRadBuf);
const aProjRad = gl.getAttribLocation(projProg, 'a_projRadius');
gl.enableVertexAttribArray(aProjRad);
gl.vertexAttribPointer(aProjRad, 1, gl.FLOAT, false, 0, 0);
gl.vertexAttribDivisor(aProjRad, 1);

gl.bindVertexArray(null);

// Uniform locations
const sU = {};
['u_res','u_cam','u_camZ','u_atlas'].forEach(n => sU[n] = gl.getUniformLocation(smokeProg, n));
const pU = {};
pU.u_res = gl.getUniformLocation(projProg, 'u_res');

// ============================================================
// PARTICLE SYSTEM
// ============================================================
const particles = []; // {x,y,z,vx,vy,rot,rotSpeed,scale,opacity,maxOpacity,age,life,tile,cr,cg,cb,deformPhase}

function emitParticle(x, y, vx, vy, opts = {}) {
  if (particles.length >= MAX_P) return;
  const depth = 0.1 + Math.random() * 0.8;
  const baseScale = (40 + Math.random() * 80) * (opts.scaleMultiplier || 1);
  const life = 3 + Math.random() * 5;
  particles.push({
    x, y, z: depth,
    vx: vx + (Math.random() - 0.5) * 15,
    vy: vy + (Math.random() - 0.5) * 10 - 8 * CFG.speed, // upward drift
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.4,
    scale: baseScale,
    opacity: 0,
    maxOpacity: (0.15 + Math.random() * 0.25) * (opts.opacityMul || 1),
    age: 0,
    life,
    tile: Math.floor(Math.random() * 16),
    cr: CFG.smokeColor[0],
    cg: CFG.smokeColor[1],
    cb: CFG.smokeColor[2],
    deformPhase: Math.random() * Math.PI * 2,
    damaged: 0, // impact damage (0-1)
  });
}

function emitFromEdges(count) {
  for (let i = 0; i < count; i++) {
    const side = Math.random();
    let x, y, vx, vy;
    if (side < 0.35) {
      // Left edge
      x = -W / 2 - 20;
      y = (Math.random() - 0.5) * H * 0.8;
      vx = 20 + Math.random() * 40;
      vy = -5 + Math.random() * -15;
    } else if (side < 0.7) {
      // Right edge
      x = W / 2 + 20;
      y = (Math.random() - 0.5) * H * 0.8;
      vx = -20 - Math.random() * 40;
      vy = -5 + Math.random() * -15;
    } else if (side < 0.85) {
      // Bottom
      x = (Math.random() - 0.5) * W;
      y = H / 2 + 20;
      vx = (Math.random() - 0.5) * 30;
      vy = -15 - Math.random() * 30;
    } else {
      // Top (less common, smoke rises)
      x = (Math.random() - 0.5) * W;
      y = -H / 2 - 20;
      vx = (Math.random() - 0.5) * 30;
      vy = -10 - Math.random() * 15;
    }
    emitParticle(x, y, vx, vy);
  }
}

function emitRing(cx, cy) {
  const count = 12;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.3;
    const speed = 30 + Math.random() * 20;
    emitParticle(cx, cy, Math.cos(angle) * speed, Math.sin(angle) * speed, {
      scaleMultiplier: 0.6,
      opacityMul: 0.7
    });
  }
}

// ============================================================
// PROJECTILES (screen-space with gravity)
// ============================================================
const projectiles = []; // {x, y, vx, vy, age, radius}
const impacts = []; // {x, y, age, strength}

function shootProjectile() {
  const speed = CFG.projectileSpeed;
  const dx = mouseX - 0;
  const dy = mouseY - 0;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  projectiles.push({
    x: 0, y: 0,
    vx: (dx / len) * speed,
    vy: (dy / len) * speed,
    age: 0,
    radius: 12,
  });
}

// ============================================================
// STATE
// ============================================================
let camX = 0, camY = 0, camZ = 0;
let mouseX = 0, mouseY = 0; // screen coords relative to center
const keys = {};
let audioLevel = 0, bassLevel = 0, lastRingTime = 0;
let audioCtx, analyser, dataArray;
let emitAccum = 0;

// ============================================================
// AUDIO
// ============================================================
async function initAudio(){
  try {
    audioCtx = new AudioContext();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  } catch(e){ console.log('No mic — synthetic pulse'); }
}

function updateAudio(t){
  if(analyser && dataArray){
    analyser.getByteFrequencyData(dataArray);
    let sum = 0, bass = 0;
    for(let i = 0; i < dataArray.length; i++){
      sum += dataArray[i];
      if(i < 10) bass += dataArray[i];
    }
    audioLevel = (sum / dataArray.length / 255) * CFG.audioReact;
    bassLevel = (bass / 10 / 255) * CFG.audioReact;
  } else {
    audioLevel = (0.12 + 0.08 * Math.sin(t * 1.3)) * CFG.audioReact;
    bassLevel = (0.18 + 0.12 * Math.sin(t * 0.7)) * CFG.audioReact;
  }
}

// ============================================================
// INPUT
// ============================================================
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => {
  mouseX = e.clientX - W / 2;
  mouseY = -(e.clientY - H / 2); // flip Y
});
canvas.addEventListener('mousedown', e => {
  if (e.button === 0) shootProjectile();
});
document.getElementById('ui').addEventListener('mousedown', e => e.stopPropagation());

// UI
document.getElementById('smokeColor').addEventListener('input', e => {
  const h = e.target.value;
  CFG.smokeColor = [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
});
document.getElementById('density').addEventListener('input', e => CFG.density = e.target.value / 100);
document.getElementById('speed').addEventListener('input', e => CFG.speed = e.target.value / 100);
document.getElementById('audioReact').addEventListener('input', e => CFG.audioReact = e.target.value / 100);

// ============================================================
// FRAME
// ============================================================
let prevT = 0;

function frame(now){
  requestAnimationFrame(frame);
  const t = now * 0.001;
  const dt = Math.min(t - prevT, 0.05);
  if (dt === 0) { prevT = t; return; }
  prevT = t;

  // Camera
  if(keys['a']) camX -= CFG.panSpeed * dt * 100;
  if(keys['d']) camX += CFG.panSpeed * dt * 100;
  if(keys['w']) camZ += CFG.moveSpeed * dt;
  if(keys['s']) camZ -= CFG.moveSpeed * dt;

  updateAudio(t);

  // --- Emit particles from edges ---
  const effectiveRate = CFG.emitRate * CFG.density * (1 + audioLevel * 2);
  emitAccum += effectiveRate * dt;
  const toEmit = Math.floor(emitAccum);
  emitAccum -= toEmit;
  emitFromEdges(toEmit);

  // Smoke rings on low audio
  if(audioLevel < 0.12 * CFG.audioReact + 0.04){
    if(t - lastRingTime > 1.4){
      emitRing(-W/2 + 50, 0);
      emitRing(W/2 - 50, 0);
      lastRingTime = t;
    }
  }

  // --- Update projectiles ---
  for(let i = projectiles.length - 1; i >= 0; i--){
    const p = projectiles[i];
    p.vy += CFG.gravity * dt * 200; // gravity pulls down
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.age += dt;
    p.radius = Math.max(6, 12 - p.age * 2);

    // Off screen or too old
    if(p.age > 5 || Math.abs(p.x) > W || Math.abs(p.y) > H){
      projectiles.splice(i, 1);
      continue;
    }

    // Check collision with particles — register impact
    let hitAny = false;
    for(let j = 0; j < particles.length; j++){
      const pp = particles[j];
      const dx = (p.x) - (pp.x - camX * (0.5 + pp.z * 0.5));
      const dy = (p.y) - (pp.y - camY * (0.5 + pp.z * 0.5));
      const dist = Math.sqrt(dx * dx + dy * dy);
      if(dist < pp.scale * 0.8){
        if(!hitAny){
          impacts.push({ x: p.x, y: p.y, age: 0, strength: 1 });
          hitAny = true;
        }
      }
    }
  }

  // --- Update impacts ---
  for(let i = impacts.length - 1; i >= 0; i--){
    impacts[i].age += dt;
    if(impacts[i].age > 4.0) impacts.splice(i, 1);
  }

  // --- Update particles ---
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.age += dt;
    if(p.age > p.life){
      particles.splice(i, 1);
      continue;
    }

    // Fade in/out
    const lifeFrac = p.age / p.life;
    if(lifeFrac < 0.1){
      p.opacity = p.maxOpacity * (lifeFrac / 0.1);
    } else if(lifeFrac > 0.7){
      p.opacity = p.maxOpacity * (1 - (lifeFrac - 0.7) / 0.3);
    } else {
      p.opacity = p.maxOpacity;
    }

    // Movement with curl noise approximation
    const curlT = t * 0.5 + p.deformPhase;
    const curlForceX = Math.sin(p.y * 0.005 + curlT) * 12;
    const curlForceY = Math.cos(p.x * 0.005 + curlT * 0.7) * 8;
    p.vx += curlForceX * dt;
    p.vy += curlForceY * dt - 5 * CFG.speed * dt; // upward drift

    // Audio pulsation
    p.vx += Math.sin(t * 3 + p.deformPhase) * bassLevel * 30 * dt;

    // Drag
    p.vx *= (1 - 0.8 * dt);
    p.vy *= (1 - 0.8 * dt);

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.rotSpeed * dt;

    // Scale grows over time
    p.scale += 8 * dt;

    // Impact interaction: push away + damage
    for(let j = 0; j < impacts.length; j++){
      const imp = impacts[j];
      const parallax = 0.5 + p.z * 0.5;
      const px = p.x - camX * parallax;
      const py = p.y - camY * parallax;
      const dx = px - imp.x;
      const dy = py - imp.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1;
      const impAge = imp.age;

      // Expanding shockwave
      const waveR = impAge * 250;
      const waveDist = Math.abs(dist - waveR);

      // Push force
      const pushForce = 800 * Math.exp(-impAge * 1.5) / (dist * 0.3 + 50);
      if(dist > 1){
        p.vx += (dx / dist) * pushForce * dt;
        p.vy += (dy / dist) * pushForce * dt;
      }

      // Ripple wave displacement
      const ripple = Math.sin(dist * 0.03 - impAge * 10) * Math.exp(-waveDist * 0.01) * Math.exp(-impAge * 0.5);
      p.vx += (dx / dist) * ripple * 200 * dt;
      p.vy += (dy / dist) * ripple * 200 * dt;

      // Swirl (tangential)
      if(dist > 10){
        const tx = -dy / dist, ty = dx / dist;
        const swirl = Math.sin(dist * 0.02 - impAge * 5) * Math.exp(-dist * 0.003) * Math.exp(-impAge * 0.4);
        p.vx += tx * swirl * 150 * dt;
        p.vy += ty * swirl * 150 * dt;
      }

      // Rotation boost from impact
      p.rotSpeed += (Math.random() - 0.5) * pushForce * dt * 0.01;

      // Damage — reduce opacity, add color shift near impact
      const damageInfluence = Math.exp(-dist * 0.005) * Math.exp(-impAge * 0.4);
      p.damaged = Math.min(1, p.damaged + damageInfluence * dt * 3);
      p.opacity *= (1 - damageInfluence * 0.5 * dt);

      // Color shift: warm near impact
      if(damageInfluence > 0.01){
        const colorShift = damageInfluence * Math.exp(-impAge * 0.3);
        p.cr = p.cr + (1.0 - p.cr) * colorShift * 0.3 * dt;
        p.cg = p.cg + (0.5 - p.cg) * colorShift * 0.2 * dt;
        p.cb = p.cb + (0.15 - p.cb) * colorShift * 0.2 * dt;
      }

      // Gradually return to base color
      const recovery = 0.3 * dt;
      p.cr += (CFG.smokeColor[0] - p.cr) * recovery;
      p.cg += (CFG.smokeColor[1] - p.cg) * recovery;
      p.cb += (CFG.smokeColor[2] - p.cb) * recovery;
    }

    // If no impacts, still recover color
    if(impacts.length === 0){
      const recovery = 0.5 * dt;
      p.cr += (CFG.smokeColor[0] - p.cr) * recovery;
      p.cg += (CFG.smokeColor[1] - p.cg) * recovery;
      p.cb += (CFG.smokeColor[2] - p.cb) * recovery;
    }

    // Kill very damaged particles faster
    if(p.damaged > 0.8){
      p.life = Math.min(p.life, p.age + 0.5);
    }
  }

  // --- Upload instance data ---
  const n = particles.length;
  for(let i = 0; i < n; i++){
    const p = particles[i];
    const i3 = i * 3, i4 = i * 4, i2 = i * 2;

    posData[i3]   = p.x;
    posData[i3+1] = p.y;
    posData[i3+2] = p.z;

    // Deformation: curl noise offset for wispy look
    const curlT = t * 0.3 + p.deformPhase;
    const deformAmt = 15 + p.scale * 0.15;
    deformData[i2]   = Math.sin(p.y * 0.004 + curlT) * deformAmt + Math.sin(curlT * 1.7 + p.x * 0.003) * deformAmt * 0.5;
    deformData[i2+1] = Math.cos(p.x * 0.004 + curlT * 0.8) * deformAmt + Math.cos(curlT * 1.3 + p.y * 0.003) * deformAmt * 0.5;

    paramData[i4]   = p.rot;
    paramData[i4+1] = p.scale;
    paramData[i4+2] = p.opacity;
    paramData[i4+3] = p.tile;

    colorData[i3]   = p.cr;
    colorData[i3+1] = p.cg;
    colorData[i3+2] = p.cb;
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, posData.subarray(0, n * 3), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, paramBuf);
  gl.bufferData(gl.ARRAY_BUFFER, paramData.subarray(0, n * 4), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
  gl.bufferData(gl.ARRAY_BUFFER, colorData.subarray(0, n * 3), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, deformBuf);
  gl.bufferData(gl.ARRAY_BUFFER, deformData.subarray(0, n * 2), gl.DYNAMIC_DRAW);

  // --- Render ---
  gl.clearColor(0.02, 0.025, 0.045, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  // Draw smoke particles
  if(n > 0){
    gl.useProgram(smokeProg);
    gl.bindVertexArray(smokeVAO);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, smokeTex);
    gl.uniform1i(sU.u_atlas, 0);
    gl.uniform2f(sU.u_res, W, H);
    gl.uniform2f(sU.u_cam, camX, camY);
    gl.uniform1f(sU.u_camZ, camZ);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
  }

  // Draw projectiles
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE); // additive
  const pCount = Math.min(projectiles.length, MAX_PROJECTILES);
  if(pCount > 0){
    for(let i = 0; i < pCount; i++){
      const p = projectiles[i];
      projPosData[i*3] = p.x;
      projPosData[i*3+1] = p.y;
      projPosData[i*3+2] = p.age;
      projRadData[i] = p.radius;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, projPosBuf);
    gl.bufferData(gl.ARRAY_BUFFER, projPosData.subarray(0, pCount * 3), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, projRadBuf);
    gl.bufferData(gl.ARRAY_BUFFER, projRadData.subarray(0, pCount), gl.DYNAMIC_DRAW);

    gl.useProgram(projProg);
    gl.bindVertexArray(projVAO);
    gl.uniform2f(pU.u_res, W, H);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, pCount);
  }

  gl.disable(gl.BLEND);
}

initAudio();
requestAnimationFrame(frame);
</script>
